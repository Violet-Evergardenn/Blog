name: Deploy to Server

on:
  push:
    branches:
      - main # 如果你的主分支叫 master，请修改为 master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Build Project
        run: npm run build

      # 将打包好的 dist 目录传输到你的服务器
      - name: Deploy to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          # 如果你使用密钥登录，请把 password 删掉或注释掉，启用下面这行
          # key: ${{ secrets.SERVER_KEY }}
          source: "dist/*"
          target: "/var/www/blog" # !! 请修改为你的服务器上 Nginx 配置的静态网页真实路径 !!
          strip_components: 1 # 去掉 dist 这一层目录，直接把里面的文件放在 target 目录下
